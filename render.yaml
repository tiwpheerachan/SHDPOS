# Render Blueprint สำหรับ SHD POS (Next.js อยู่ในโฟลเดอร์ web)
# วิธีใช้: Render → New → Blueprint → เลือก repo นี้ แล้ว Render จะอ่านไฟล์นี้
# ค่า sync:false คือ Render จะให้คุณกรอกค่าเองตอน deploy (ไม่เก็บลง repo)
services:
  - type: web
    name: shdpos
    runtime: node
    rootDir: web
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_COMPANY_NAME
        sync: false
      - key: NEXT_PUBLIC_COMPANY_TAX_ID
        sync: false
      # ===== Central SSO (sso.shd-technology.co.th) =====
      - key: CENTRAL_SSO_BASE
        value: https://sso.shd-technology.co.th
      - key: SSO_CLIENT_ID
        value: cli_ded9cc38e97a290c
      - key: SSO_CLIENT_SECRET      # ลับ — วางใบใหม่หลังหมุน secret
        sync: false
      - key: CENTRAL_API_KEY        # ลับ — dv_live_... วางใบใหม่หลังออก key ใหม่
        sync: false
      - key: SSO_SESSION_SECRET     # ลับ — สุ่มเอง (openssl rand -hex 32)
        sync: false
      - key: NEXT_PUBLIC_SUPERADMIN_EMAILS   # ผู้ดูแลสูงสุด (คั่นด้วย , ได้)
        value: tiw.pheerachan@shd-technology.co.th
      # ===== OneWarehouse / JST (ฝั่ง server เท่านั้น) =====
      - key: ONEWAREHOUSE_BASE            # URL /v1 ของ OW (production ต่างจาก UAT)
        sync: false
      - key: ONEWAREHOUSE_ENV             # uat | production — ต้องตรงกับ BASE (production = remark ไม่มี "test")
        sync: false
      - key: ONEWAREHOUSE_SUB             # Central Login sub (ตัวเลข) ที่ OW ให้สิทธิ์
        sync: false
      - key: ONEWAREHOUSE_SERVICE_TOKEN   # ลับ — ขอใบใหม่ (ใบเดิมเคยหลุดในแชต)
        sync: false
      - key: OW_SYNC_CRON_SECRET          # ลับ ≥32 ตัว — ใช้กับ /api/internal/ow-outbox (cron ภายนอก)
        sync: false
      # ===== อื่น ๆ =====
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY  # จำกัด HTTP referrer เป็นโดเมนจริง (ใบเดิมเคยหลุด)
        sync: false
      - key: ANTHROPIC_API_KEY            # ผู้ช่วย AI (ไม่ใส่ = ใช้ตัวแยกคำถามในเครื่อง)
        sync: false
      # ===== เอกสาร / ลิงก์แชร์ =====
      - key: DOC_SHARE_SECRET              # ลับ ≥32 ตัว — ลงลายเซ็นลิงก์แชร์เอกสาร (ถ้าไม่ตั้งใช้ SSO_SESSION_SECRET)
        sync: false
      - key: COMPANY_ADDRESS               # ที่อยู่สำนักงานใหญ่บนหัวเอกสาร (ใช้เมื่อสาขาไม่มีที่อยู่)
        sync: false
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_NAME_EN
        sync: false
