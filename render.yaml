# Render Blueprint สำหรับ SHD POS (Next.js อยู่ในโฟลเดอร์ web)
# วิธีใช้: Render → New → Blueprint → เลือก repo นี้ แล้ว Render จะอ่านไฟล์นี้
# ค่า sync:false คือ Render จะให้คุณกรอกค่าเองตอน deploy (ไม่เก็บลง repo)
services:
  - type: web
    name: shdpos
    runtime: node
    rootDir: web
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_COMPANY_NAME
        sync: false
      - key: NEXT_PUBLIC_COMPANY_TAX_ID
        sync: false
      # ===== Central SSO (sso.shd-technology.co.th) =====
      - key: CENTRAL_SSO_BASE
        value: https://sso.shd-technology.co.th
      - key: SSO_CLIENT_ID
        value: cli_ded9cc38e97a290c
      - key: SSO_CLIENT_SECRET      # ลับ — วางใบใหม่หลังหมุน secret
        sync: false
      - key: CENTRAL_API_KEY        # ลับ — dv_live_... วางใบใหม่หลังออก key ใหม่
        sync: false
      - key: SSO_SESSION_SECRET     # ลับ — สุ่มเอง (openssl rand -hex 32)
        sync: false
      - key: NEXT_PUBLIC_SUPERADMIN_EMAILS   # ผู้ดูแลสูงสุด (คั่นด้วย , ได้)
        value: tiw.pheerachan@shd-technology.co.th
